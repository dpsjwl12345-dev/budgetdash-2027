<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Explainer Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; }
    h1 { margin-bottom: 30px; color: #333; }
    .controls { margin-bottom: 30px; display: flex; gap: 10px; }
    select, button { padding: 10px 15px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #0066cc; color: white; cursor: pointer; font-weight: 600; }
    button:hover { background: #0052a3; }
    .loading { color: #999; font-style: italic; }
    .error { color: #c00; padding: 15px; background: #fee; border-radius: 4px; margin: 20px 0; }
    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .section {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 20px;
      background: #fafafa;
      max-height: 500px;
      overflow-y: auto;
    }
    .section h3 {
      margin-bottom: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #0066cc;
      text-transform: uppercase;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 10px;
    }
    .section-content {
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #333;
    }
    .info { padding: 10px; background: #e3f2fd; border-left: 4px solid #0066cc; margin: 20px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Budget Explainer 테스트</h1>

    <div class="controls">
      <select id="deptSelect">
        <option value="">부서 선택...</option>
      </select>
      <select id="detailSelect" disabled>
        <option value="">세부사업 선택...</option>
      </select>
      <button onclick="loadData()">📥 데이터 로드</button>
    </div>

    <div id="loading" class="loading" style="display:none;">데이터를 불러오는 중...</div>
    <div id="error" class="error" style="display:none;"></div>
    <div class="info" id="info" style="display:none;"></div>

    <div id="content"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3002';
    const departments = ['문화예술과'];

    // Initialize department select
    const deptSelect = document.getElementById('deptSelect');
    departments.forEach(dept => {
      const option = document.createElement('option');
      option.value = dept;
      option.textContent = dept;
      deptSelect.appendChild(option);
    });

    deptSelect.onchange = () => {
      loadDetails();
      document.getElementById('content').innerHTML = '';
    };

    async function loadDetails() {
      const dept = deptSelect.value;
      if (!dept) return;

      try {
        const res = await fetch(`${API_BASE}/api/budget-explainer/data?department=${encodeURIComponent(dept)}`);
        const { data } = await res.json();

        const detailSelect = document.getElementById('detailSelect');
        detailSelect.innerHTML = '<option value="">세부사업 선택...</option>';
        detailSelect.disabled = false;

        function collectDetails(nodes, path = '') {
          nodes.forEach(node => {
            if (node.level === '세부사업') {
              const option = document.createElement('option');
              option.value = [dept, node.policy || path.split('|')[1], node.unit || path.split('|')[2], node.title].join('|');
              option.textContent = `${node.unit} > ${node.title}`;
              detailSelect.appendChild(option);
            }
            if (node.children?.length > 0) {
              const newPath = path ? `${path}|${node.title}` : `${dept}|${node.title}`;
              collectDetails(node.children, newPath);
            }
          });
        }

        if (data?.length > 0) {
          collectDetails(data[0].children || []);
        }
      } catch (e) {
        showError('세부사업 로드 실패: ' + e.message);
      }
    }

    async function loadData() {
      const value = document.getElementById('detailSelect').value;
      if (!value) {
        showError('세부사업을 선택해주세요');
        return;
      }

      const [dept, policy, unit, detail] = value.split('|');

      showLoading(true);
      try {
        const res = await fetch(
          `${API_BASE}/api/budget-explainer/get-material?` +
          `department=${encodeURIComponent(dept)}` +
          `&policy=${encodeURIComponent(policy)}` +
          `&unit=${encodeURIComponent(unit)}` +
          `&detail=${encodeURIComponent(detail)}`
        );
        const { data } = await res.json();

        if (!data) {
          showError('저장된 데이터가 없습니다');
          return;
        }

        let sections = [];
        try {
          sections = JSON.parse(data.sections_json || '[]');
        } catch (e) {
          sections = [];
        }

        displayData(dept, policy, unit, detail, sections, data);
      } catch (e) {
        showError('데이터 로드 실패: ' + e.message);
      } finally {
        showLoading(false);
      }
    }

    function displayData(dept, policy, unit, detail, sections, data) {
      const info = document.getElementById('info');
      info.textContent = `부서: ${dept} | 정책: ${policy} | 단위: ${unit} | 세부: ${detail}`;
      info.style.display = 'block';

      let html = '<div class="sections-grid">';
      if (sections.length > 0) {
        sections.forEach(section => {
          html += `
            <div class="section">
              <h3>${section.title}</h3>
              <div class="section-content">${escapeHtml(section.content)}</div>
            </div>
          `;
        });
      } else {
        html += '<div class="error">섹션 데이터가 없습니다</div>';
      }
      html += '</div>';

      document.getElementById('content').innerHTML = html;
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    function showError(msg) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '❌ ' + msg;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    window.addEventListener('load', () => {
      deptSelect.value = '문화예술과';
      loadDetails();
    });
  </script>
</body>
</html>
